services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atp_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-atp_proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atp_proxy_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  atp-proxy:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LANG: C
      LC_ALL: C
      # The process must listen on the container interface for published ports
      # to be reachable by an engine running on the Docker host.
      ZMQ_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-atp_proxy}:${POSTGRES_PASSWORD:-atp_proxy_change_me}@postgres:5432/${POSTGRES_DB:-atp_proxy}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ZMQ_PUB_PORT:-5585}:${ZMQ_PUB_PORT:-5585}"
      - "${ZMQ_REP_PORT:-5586}:${ZMQ_REP_PORT:-5586}"
    volumes:
      - ./flow:/app/flow
      - ./logs:/app/logs

volumes:
  postgres-data:
